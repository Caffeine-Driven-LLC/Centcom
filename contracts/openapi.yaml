components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA access token (15 min, aud centcom-api). OAuth scopes are listed per operation in x-scopes (profile, workspaces:read,
        ...).
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: cen_live_/cen_test_ API key
      description: Machine credential with an explicit scope subset. Cannot mint relay tickets or join sessions. Accepted only on operations that
        list it in `security`.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 200
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from next_cursor; expires after 24 h, bound to the same filters
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: ULID or UUID, max 64 chars; stored 24 h
      schema:
        type: string
        maxLength: 64
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: ULID or UUID, max 64 chars; stored 24 h. Needed for safe retries of this POST.
      schema:
        type: string
        maxLength: 64
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the resource version being modified; mismatch gives 412 precondition_failed
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client request id (valid req_ ULID); the server reuses it
      schema:
        $ref: '#/components/schemas/RequestId'
  headers:
    X-Request-Id:
      description: Request id (req_ ULID); echoed from the request when valid
      schema:
        $ref: '#/components/schemas/RequestId'
    RateLimit-Limit:
      description: Requests allowed in the current window
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests remaining in the current window
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until the window resets
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying
      schema:
        type: integer
    ETag:
      description: Entity tag for conditional requests (If-Match / If-None-Match)
      schema:
        type: string
    Idempotency-Replayed:
      description: '`true` when this response is a replay of a stored idempotent response'
      schema:
        type: boolean
  responses:
    BadRequest:
      description: '400: invalid_request, idempotency_key_required, unsupported_protocol, invalid_grant, authorization_pending, slow_down, expired_token,
        invalid_scope, invalid_frame, protocol_violation, signature_invalid'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - invalid_request
      - idempotency_key_required
      - unsupported_protocol
      - invalid_grant
      - authorization_pending
      - slow_down
      - expired_token
      - invalid_scope
      - invalid_frame
      - protocol_violation
      - signature_invalid
    Unauthorized:
      description: '401: unauthorized, token_expired, token_invalid, token_revoked, device_revoked, refresh_reuse_detected, invalid_client, ticket_invalid,
        ticket_replayed'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - refresh_reuse_detected
      - invalid_client
      - ticket_invalid
      - ticket_replayed
    PaymentRequired:
      description: '402: payment_required'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - payment_required
    Forbidden:
      description: '403: access_denied, forbidden, not_a_member, role_insufficient, entitlement_required, seat_limit_reached, member_limit_reached,
        subscription_inactive, owner_required, session_full, session_locked, host_required, muted, queue_not_allowed, webhook_limit_reached, api_key_limit_reached,
        pair_bad_code'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - access_denied
      - forbidden
      - not_a_member
      - role_insufficient
      - entitlement_required
      - seat_limit_reached
      - member_limit_reached
      - subscription_inactive
      - owner_required
      - session_full
      - session_locked
      - host_required
      - muted
      - queue_not_allowed
      - webhook_limit_reached
      - api_key_limit_reached
      - pair_bad_code
    NotFound:
      description: '404: not_found, workspace_not_found, invite_invalid, session_not_found, device_unknown, snapshot_missing'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - not_found
      - workspace_not_found
      - invite_invalid
      - session_not_found
      - device_unknown
      - snapshot_missing
    Conflict:
      description: '409: conflict, idempotency_conflict, member_exists, session_paused, queue_item_gone, lock_denied, key_required, key_unknown,
        snapshot_hash_mismatch, account_deletion_pending, export_not_ready'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - conflict
      - idempotency_conflict
      - member_exists
      - session_paused
      - queue_item_gone
      - lock_denied
      - key_required
      - key_unknown
      - snapshot_hash_mismatch
      - account_deletion_pending
      - export_not_ready
    Gone:
      description: '410: gone, invite_expired, invite_revoked, session_ended, history_unavailable'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - gone
      - invite_expired
      - invite_revoked
      - session_ended
      - history_unavailable
    PreconditionFailed:
      description: '412: precondition_failed'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - precondition_failed
    PayloadTooLarge:
      description: '413: payload_too_large, frame_too_large'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - payload_too_large
      - frame_too_large
    UnsupportedMediaType:
      description: '415: unsupported_media_type'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - unsupported_media_type
    ValidationFailed:
      description: '422: validation_failed, coupon_invalid, webhook_url_invalid'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - validation_failed
      - coupon_invalid
      - webhook_url_invalid
    ClientTooOld:
      description: '426: client_too_old'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - client_too_old
    RateLimited:
      description: '429: rate_limited, quota_exceeded, slow_consumer, frame_rate_exceeded, queue_full, pair_locked_out'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - rate_limited
      - quota_exceeded
      - slow_consumer
      - frame_rate_exceeded
      - queue_full
      - pair_locked_out
    InternalError:
      description: '500: internal_error'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - internal_error
    BadGateway:
      description: '502: bad_gateway'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - bad_gateway
    ServiceUnavailable:
      description: '503: service_unavailable'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - service_unavailable
    Timeout:
      description: '504: timeout'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      x-error-codes:
      - timeout
  schemas:
    UserId:
      type: string
      pattern: ^usr_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a user.
      examples:
      - usr_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    WorkspaceId:
      type: string
      pattern: ^wsp_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a workspace.
      examples:
      - wsp_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    DeviceId:
      type: string
      pattern: ^dev_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a device.
      examples:
      - dev_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    MemberId:
      type: string
      pattern: ^mem_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a membership.
      examples:
      - mem_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    InviteId:
      type: string
      pattern: ^inv_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a invite.
      examples:
      - inv_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    ApiKeyId:
      type: string
      pattern: ^key_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a API key.
      examples:
      - key_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    WebhookId:
      type: string
      pattern: ^whk_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a webhook endpoint.
      examples:
      - whk_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    DeliveryId:
      type: string
      pattern: ^dlv_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a webhook delivery.
      examples:
      - dlv_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    NotificationId:
      type: string
      pattern: ^ntf_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a notification.
      examples:
      - ntf_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    SnapshotId:
      type: string
      pattern: ^snp_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a snapshot.
      examples:
      - snp_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    ProjectId:
      type: string
      pattern: ^prj_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a project.
      examples:
      - prj_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    SessionId:
      type: string
      pattern: ^ses_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a session.
      examples:
      - ses_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    SubscriptionId:
      type: string
      pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a subscription.
      examples:
      - sub_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    AuditEventId:
      type: string
      pattern: ^aud_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a audit event.
      examples:
      - aud_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    RequestId:
      type: string
      pattern: ^req_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a request.
      examples:
      - req_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    AgentId:
      type: string
      pattern: ^agt_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a agent.
      examples:
      - agt_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    ExportId:
      type: string
      pattern: ^exp_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a export job (prefix not defined in CT-IDS; see x-gaps).
      examples:
      - exp_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    PushSubscriptionId:
      type: string
      pattern: ^psh_[0-9A-HJKMNP-TV-Z]{26}$
      maxLength: 40
      description: Prefixed ULID of a push subscription (prefix not defined in CT-IDS; see x-gaps).
      examples:
      - psh_01JA3Z8K2M5N7P9Q0R1S2T3V4W
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: Minor units (cents)
        currency:
          type: string
          enum:
          - USD
          - EUR
      required:
      - amount
      - currency
    Role:
      type: string
      enum:
      - owner
      - admin
      - member
      - billing
      - guest
      description: Workspace role. Consumers must tolerate unknown values.
    SessionRole:
      type: string
      enum:
      - host
      - editor
      - viewer
    Scope:
      type: string
      enum:
      - profile
      - workspaces:read
      - workspaces:write
      - sessions:read
      - sessions:write
      - sessions:host
      - billing:read
      - billing:write
      - usage:write
      - webhooks:write
      - audit:read
    ProblemError:
      type: object
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request
        code:
          type: string
        detail:
          type: string
      required:
      - pointer
      - code
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable code from errors.json
        detail:
          type: string
        instance:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        retry_after_s:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'
      required:
      - type
      - title
      - status
      - code
      - request_id
      description: RFC 9457 problem details (CT-ERR). Defined inline; no contracts/schemas/problem.schema.json existed when written.
    Page:
      type: object
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      required:
      - data
      - next_cursor
      - has_more
      description: Generic CT-PAGE wrapper; typed variants are <Name>Page.
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        locale:
          type: string
          description: BCP 47
          default: en
        avatar:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Avatar slot identifier
        telemetry:
          type: boolean
        created_at:
          type: string
          format: date-time
        deletion_scheduled_for:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - email
      - display_name
      - locale
      - telemetry
      - created_at
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        plan:
          type: string
          enum:
          - free
          - pro
          - team
        active_workspace:
          oneOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - type: 'null'
        ent:
          type: integer
      required:
      - user
      - plan
      - active_workspace
      - ent
      description: Current user, plan summary, active workspace and entitlement revision (the access-token `ent` claim).
    MeUpdate:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        locale:
          type: string
        avatar:
          type:
          - string
          - 'null'
          maxLength: 64
        telemetry:
          type: boolean
      minProperties: 1
    AccountDeletion:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending_deletion
        scheduled_for:
          type: string
          format: date-time
        grace_days:
          type: integer
      required:
      - status
      - scheduled_for
    DataExport:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ExportId'
        status:
          type: string
          enum:
          - pending
          - ready
          - failed
          - expired
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        download_url:
          type:
          - string
          - 'null'
          format: uri
          description: Signed, short-lived
        size_bytes:
          type:
          - integer
          - 'null'
      required:
      - id
      - status
      - created_at
    Device:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DeviceId'
        name:
          type: string
        platform:
          type: string
          enum:
          - linux
          - macos
          - windows
          - web
          - other
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        key_fingerprint:
          type: string
          description: ABCD-EFGH-IJKL (CT-CRYPTO)
        current:
          type: boolean
      required:
      - id
      - name
      - platform
      - created_at
      - key_fingerprint
    DeviceKeys:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/DeviceId'
        x25519:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32-byte raw key, base64url without padding
        ed25519:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 32-byte raw key, base64url without padding
        fingerprint:
          type: string
        revoked:
          type: boolean
      required:
      - device
      - x25519
      - ed25519
      - fingerprint
    ApiKey:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ApiKeyId'
        workspace:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 60
        prefix:
          type: string
          description: First 8 chars of the key, display only
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        created_by:
          $ref: '#/components/schemas/UserId'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - workspace
      - name
      - prefix
      - scopes
      - created_at
    ApiKeyCreate:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 60
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          minItems: 1
        expires_at:
          type: string
          format: date-time
      required:
      - workspace
      - name
      - scopes
    ApiKeyCreated:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - type: object
        properties:
          secret:
            type: string
            pattern: ^cen_(live|test)_[A-Za-z0-9]{32}$
            description: Returned once only
        required:
        - secret
    WorkspaceSettings:
      type: object
      properties:
        auto_approve:
          type: string
          enum:
          - ask
          - trusted
          - everyone
          description: Default auto-approve level (matches control.policy.auto_approve)
        share_history:
          type: boolean
        history_retention_days:
          type:
          - integer
          - 'null'
      required:
      - auto_approve
      - share_history
      description: Retention override must not exceed the plan history_days.
    WorkspaceSettingsUpdate:
      type: object
      properties:
        auto_approve:
          type: string
          enum:
          - ask
          - trusted
          - everyone
        share_history:
          type: boolean
        history_retention_days:
          type:
          - integer
          - 'null'
          minimum: 0
      minProperties: 1
    Workspace:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 60
        slug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
        role:
          $ref: '#/components/schemas/Role'
        owner:
          $ref: '#/components/schemas/UserId'
        plan:
          type: string
          enum:
          - free
          - pro
          - team
        member_count:
          type: integer
        created_at:
          type: string
          format: date-time
        settings:
          $ref: '#/components/schemas/WorkspaceSettings'
      required:
      - id
      - name
      - slug
      - created_at
    WorkspaceCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        slug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
      required:
      - name
    WorkspaceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        settings:
          $ref: '#/components/schemas/WorkspaceSettingsUpdate'
      minProperties: 1
    Member:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MemberId'
        user:
          $ref: '#/components/schemas/UserId'
        display_name:
          type: string
        email:
          type: string
          format: email
          description: Omitted for guests / limited views
        role:
          $ref: '#/components/schemas/Role'
        joined_at:
          type: string
          format: date-time
      required:
      - id
      - user
      - display_name
      - role
      - joined_at
    MemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum:
          - admin
          - member
          - billing
          - guest
          description: owner is only assignable via transfer-ownership
      required:
      - role
    OwnershipTransfer:
      type: object
      properties:
        to_member:
          $ref: '#/components/schemas/MemberId'
      required:
      - to_member
    Invite:
      type: object
      properties:
        id:
