openapi: 3.1.0
info:
  title: Centcom REST API
  version: 1.1.0
  description: Machine-readable REST contract for Centcom (contract_version 1.0.0). Wins over contracts/02-rest-api.md on disagreement. Errors
    are RFC 9457 problem+json with stable codes from errors.json. Clients must ignore unknown response fields and tolerate unknown enum values
    (CT-VER).
  license:
    name: Proprietary
servers:
- url: https://api.centcom.dev
tags:
- name: Auth
  description: CT-AUTH
- name: Accounts
  description: CT-API-ACCOUNTS
- name: Workspaces
  description: CT-API-WORKSPACES
- name: Sessions
  description: CT-API-SESSIONS
- name: Billing
  description: CT-API-BILLING
- name: Usage
  description: CT-API-USAGE
- name: Audit
  description: CT-API-AUDIT
- name: Notifications
  description: CT-API-NOTIFY
- name: Webhooks
  description: CT-API-WEBHOOKS
- name: Releases
  description: CT-API-RELEASES
- name: Flags
  description: CT-API-FLAGS
- name: Telemetry
  description: CT-TELEMETRY
- name: Status
  description: CT-STATUS
security:
- bearerAuth: []
paths:
  /v1/auth/device/code:
    post:
      operationId: startDeviceAuthorization
      tags:
      - Auth
      summary: Start device authorization flow
      description: Starts an RFC 8628 device flow and registers the device public keys; no authentication required (public clients, 20 req/min/IP).
      x-contract: CT-AUTH
      x-scopes: []
      x-role: public
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - invalid_client
      - invalid_scope
      - invalid_request
      - validation_failed
      - payload_too_large
      - unsupported_media_type
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/token:
    post:
      operationId: issueToken
      tags:
      - Auth
      summary: Token endpoint
      description: 'Exchanges a device code, PKCE authorization code or refresh token for tokens; public endpoint, web clients must send X-Centcom-Client:
        web.'
      x-contract: CT-AUTH
      x-scopes: []
      x-role: public
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - invalid_grant
      - authorization_pending
      - slow_down
      - access_denied
      - expired_token
      - invalid_client
      - invalid_scope
      - refresh_reuse_detected
      - invalid_request
      - validation_failed
      - payload_too_large
      - unsupported_media_type
      security: []
      parameters:
      - name: X-Centcom-Client
        in: header
        required: false
        description: Must be `web` for browser clients (CSRF guard)
        schema:
          type: string
          enum:
          - web
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/authorize:
    get:
      operationId: authorize
      tags:
      - Auth
      summary: Browser authorize (PKCE)
      description: Public browser endpoint that starts an authorization-code + PKCE (S256 only) flow and redirects to the login page or redirect_uri.
      x-contract: CT-AUTH
      x-scopes: []
      x-role: public
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - invalid_client
      - invalid_scope
      - invalid_request
      security: []
      parameters:
      - name: response_type
        in: query
        required: true
        description: Must be `code`
        schema:
          type: string
          enum:
          - code
      - name: client_id
        in: query
        required: true
        description: Public client id
        schema:
          type: string
          enum:
          - centcom-cli
          - centcom-web
          - centcom-tui
      - name: redirect_uri
        in: query
        required: true
        description: Exact match against the registered allow-list (e.g. centcom://auth/callback)
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        description: PKCE challenge
        schema:
          type: string
          minLength: 43
          maxLength: 128
      - name: code_challenge_method
        in: query
        required: true
        description: S256 only
        schema:
          type: string
          enum:
          - S256
      - name: scope
        in: query
        required: false
        description: Space-separated scopes
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: Opaque CSRF state, echoed back
        schema:
          type: string
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '302':
          description: Redirect to the login page, or to redirect_uri with `code` and `state`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              schema:
                type: string
                format: uri-reference
              required: true
              description: Redirect target
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/revoke:
    post:
      operationId: revokeToken
      tags:
      - Auth
      summary: Revoke a refresh token or device
      description: Revokes a refresh token or one of the caller's devices per RFC 7009 (always 200 for unknown tokens); any authenticated user
        for own credentials.
      x-contract: CT-AUTH
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      - invalid_request
      - validation_failed
      - payload_too_large
      - unsupported_media_type
      security:
      - bearerAuth:
        - profile
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Revoked (or already unknown)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/devices:
    get:
      operationId: listAuthDevices
      tags:
      - Auth
      summary: List the user's devices
      description: Lists the caller's registered devices; any authenticated user, own devices only.
      x-contract: CT-AUTH
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      security:
      - bearerAuth:
        - profile
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/devices/{id}:
    delete:
      operationId: revokeAuthDevice
      tags:
      - Auth
      summary: Revoke a device
      description: Revokes one of the caller's devices, kills its tokens and flags its keys; any authenticated user, own devices only.
      x-contract: CT-AUTH
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - device_unknown
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      - not_found
      security:
      - bearerAuth:
        - profile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DeviceId'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '204':
          description: No content
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me:
    get:
      operationId: getMe
      tags:
      - Accounts
      summary: Current user
      description: Returns the current user, plan summary, active workspace and entitlement revision; any authenticated user.
      x-contract: CT-API-ACCOUNTS
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      security:
      - bearerAuth:
        - profile
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateMe
      tags:
      - Accounts
      summary: Update profile
      description: Updates display name, locale, avatar slot and telemetry opt-in; any authenticated user, own profile only.
      x-contract: CT-API-ACCOUNTS
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      - invalid_request
      - validation_failed
      - payload_too_large
      - unsupported_media_type
      security:
      - bearerAuth:
        - profile
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMe
      tags: &id001
      - Accounts
      summary: Begin account deletion
      description: Starts account deletion with a 30-day grace period (Location points at the status resource); any authenticated user, own account
        only.
      x-contract: CT-API-ACCOUNTS
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - account_deletion_pending
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      security: &id002
      - bearerAuth:
        - profile
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '202':
          description: Accepted
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL of the created or status resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/export:
    post:
      operationId: requestDataExport
      tags:
      - Accounts
      summary: Request a data export
      description: Requests an asynchronous export of the caller's data; any authenticated user, own data only.
      x-contract: CT-API-ACCOUNTS
      x-scopes:
      - profile
      x-role: any
      x-idempotency: accepted
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - account_deletion_pending
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      - idempotency_conflict
      security:
      - bearerAuth:
        - profile
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '202':
          description: Accepted
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Idempotency-Replayed:
              $ref: '#/components/headers/Idempotency-Replayed'
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL of the created or status resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/export/{id}:
    get:
      operationId: getDataExport
      tags:
      - Accounts
      summary: Export status
      description: Returns export status and, when ready, a signed download URL; any authenticated user, own exports only.
      x-contract: CT-API-ACCOUNTS
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - export_not_ready
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      - not_found
      security:
      - bearerAuth:
        - profile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ExportId'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/devices:
    get:
      operationId: listDevices
      tags:
      - Accounts
      summary: List own devices
      description: Lists the caller's own devices; any authenticated user.
      x-contract: CT-API-ACCOUNTS
      x-scopes:
      - profile
      x-role: any
      x-idempotency: none
      x-error-codes:
      - rate_limited
      - internal_error
      - service_unavailable
      - unauthorized
      - token_expired
      - token_invalid
      - token_revoked
      - device_revoked
      - client_too_old
      - forbidden
      security:
      - bearerAuth:
        - profile
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/ClientTooOld'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/devices/{id}:
    get:
      operationId: getDevice
      tags:
