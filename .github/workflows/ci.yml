name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch: # claude-pr.yml runs main's CI after a merge made with GITHUB_TOKEN

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pnpm version from package.json (packageManager)
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile
      - name: Generated protocol code matches contracts/
        run: pnpm --filter @centcom/protocol gen --check
      - name: HTTP operation table matches openapi.yaml
        run: pnpm --filter @centcom/net gen:http --check
      - name: Agent states doc is up to date
        run: pnpm exec tsx tools/docs/states-doc.ts --check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build the web app
        run: pnpm web:build
      - name: Plan, contracts and contract lock
        run: pnpm plan:check
      - name: README progress is up to date
        run: python3 tools/plan/progress.py --check
