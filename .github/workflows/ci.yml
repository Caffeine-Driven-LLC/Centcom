name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, reads the pnpm version from package.json (packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile
      - name: Generated protocol code matches contracts/
        run: pnpm --filter @centcom/protocol gen --check
      - name: HTTP operation table matches openapi.yaml
        run: pnpm --filter @centcom/net gen:http --check
      - name: Agent states doc is up to date
        run: pnpm exec tsx tools/docs/states-doc.ts --check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Security checks (secrets, pinning, lockfile, workflows, licences, audit)
        run: pnpm security:check
      - name: Build the web app
        run: pnpm web:build
      - name: Plan, contracts and contract lock
        run: pnpm plan:check
      - name: README progress is up to date
        run: python3 tools/plan/progress.py --check
