name: bench
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Benchmarks
        run: pnpm bench
        continue-on-error: true
      - name: Keep the history
        run: node -e "const fs=require('fs');const h=fs.existsSync('perf-history.json')?JSON.parse(fs.readFileSync('perf-history.json','utf8')):[];h.push({at:new Date().toISOString(),...JSON.parse(fs.readFileSync('bench-results.json','utf8'))});fs.writeFileSync('perf-history.json',JSON.stringify(h.slice(-90)))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench
          path: |
            bench-results.json
            perf-history.json
