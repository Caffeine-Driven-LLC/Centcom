# Claude PR pipeline: reviews, fixes and merges lane PRs labelled `claude-automerge`, so PRs from an
# unattended local Claude Code session can land overnight. Every trigger re-reads the PR, and
# tools/ci/claude-pr-state.mjs picks one step: review, fix CI, update from main, merge, or hand off.
# Claude edits and pushes; only the script decides a merge, and only the record job, which runs no
# PR code, writes the claude-review status. PR events arrive through claude-pr-trigger.yml, so this
# file always runs as it is on main. Pause with the repository variable CLAUDE_AUTOMERGE=off.
# Setup, costs and recovery: CLAUDE.md.
name: claude-pr

on:
  workflow_run:
    workflows: [claude-pr-trigger, CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
  schedule:
    # Safety net for lost events. Rare on purpose: Actions minutes are capped on this plan, and a
    # local waiter (tools/ci/claude-pr-wait.mjs) re-dispatches its own PR when it goes quiet.
    - cron: '17 */4 * * *'
  push:
    branches: [main] # tripwire only

permissions:
  contents: read

# One run per PR at a time, queued rather than cancelled: a queued run re-plans from the PR's
# state when it starts, so dropping an older queued run loses nothing.
concurrency:
  group: claude-pr-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || github.run_id }}
  cancel-in-progress: false

env:
  PR: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr }}

jobs:
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-plan every actionable opted-in PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --label claude-automerge --limit 1000 \
            --search 'draft:false -label:claude-needs-human -label:do-not-merge' \
            --json number --jq '.[].number' | sort -n | while read -r n; do
            gh workflow run claude-pr.yml -f pr="$n"
          done

  tripwire:
    # Merges by this pipeline use GITHUB_TOKEN and start no push runs, so a push to main by the
    # Claude App means something pushed past the merge gate.
    if: github.event_name == 'push' && github.actor == 'claude[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Raise the alarm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create --title "Claude App pushed to main directly ($GITHUB_SHA)" \
            --body "A push to main by claude[bot] bypassed the Claude PR pipeline's merge gate. Review commit $GITHUB_SHA and pause the pipeline (CLAUDE_AUTOMERGE=off) until it is understood."
          echo "::error::claude[bot] pushed to main directly"
          exit 1

  plan:
    # workflow_run: only runs started by a PR, not cancelled or skipped, and either the relay of an
    # opted-in PR's event or a CI run on a lane branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'skipped' &&
       (github.event.workflow_run.name == 'claude-pr-trigger' ||
        startsWith(github.event.workflow_run.head_branch, 'lane/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read # gh's statusCheckRollup reads workflow runs
    outputs:
      action: ${{ steps.plan.outputs.action }}
      reason: ${{ steps.plan.outputs.reason }}
      head: ${{ steps.plan.outputs.head }}
      head_ref: ${{ steps.plan.outputs.head_ref }}
      review: ${{ steps.plan.outputs.review }}
      prompt: ${{ steps.plan.outputs.prompt }}
      tools: ${{ steps.plan.outputs.tools }}
    steps:
      # The state script and prompts come from main, never from the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pick the next step
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_AUTOMERGE: ${{ vars.CLAUDE_AUTOMERGE }}
          HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: node tools/ci/claude-pr-state.mjs "$PR"

  claude:
    needs: plan
    if: contains(fromJSON('["review","fix-ci","update"]'), needs.plan.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No statuses or pull-requests scope: this job may run PR code (fix-ci, conflict resolution).
    permissions:
      contents: read # Claude pushes with the Claude App token
      actions: read # CI logs, for fix-ci
      id-token: write # OIDC exchange for the Claude App token
    outputs:
      local: ${{ steps.final.outputs.local }}
      outcome: ${{ steps.claude.outcome }}
      verdict: ${{ fromJSON(steps.claude.outputs.structured_output || '{}').verdict }}
      summary: ${{ fromJSON(steps.claude.outputs.structured_output || '{}').summary }}
    env:
      ACTION: ${{ needs.plan.outputs.action }}
      CLAUDE_BOT_ID: '209825114' # claude[bot]
    steps:
      # Check out the planned SHA, then name the branch: if the PR moved since planning, Claude's
      # push is not a fast-forward and fails, and the record job hands off or re-plans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0 # also fetches origin/main for the update step
          persist-credentials: false
      - name: Branch at the planned head
        env:
          HEAD_REF: ${{ needs.plan.outputs.head_ref }}
        run: git checkout -B "$HEAD_REF"

      # Before touching the tree: will Claude have to resolve conflicts beyond the progress files?
      # Then it needs dependencies, installed now while package.json and the lockfile are valid.
      - name: Predict merge conflicts
        id: probe
        if: env.ACTION == 'update'
        run: |
          needs=false
          if ! out="$(git merge-tree --write-tree --name-only --no-messages HEAD origin/main)"; then
            others="$(printf '%s\n' "$out" | tail -n +2 \
              | grep -vxF -e plan/STATUS.json -e README.md -e docs/progress.svg || true)"
            [ -n "$others" ] && needs=true
          fi
          echo "claude_resolves=$needs" >> "$GITHUB_OUTPUT"

      # No cache: this job runs on main's ref, and a cache it saved would be restored by main's CI.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.ACTION == 'fix-ci' || steps.probe.outputs.claude_resolves == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.ACTION == 'fix-ci' || steps.probe.outputs.claude_resolves == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install (frozen lockfile)
        if: env.ACTION == 'fix-ci' || steps.probe.outputs.claude_resolves == 'true'
        run: pnpm install --frozen-lockfile

      # main's copy of the bookkeeping helper resolves progress-file conflicts and regenerates them.
      - name: Merge main
        if: env.ACTION == 'update'
        run: |
          git config user.name 'claude[bot]'
          git config user.email "${CLAUDE_BOT_ID}+claude[bot]@users.noreply.github.com"
          git show origin/main:tools/ci/claude-pr-bookkeeping.mjs > "$RUNNER_TEMP/bookkeeping.mjs"
          if git merge --no-ff --no-edit origin/main; then
            node "$RUNNER_TEMP/bookkeeping.mjs" refresh
          else
            node "$RUNNER_TEMP/bookkeeping.mjs" resolve
          fi

      - name: Claude
        id: claude
        timeout-minutes: 25 # a step timeout fails the step; the record job still runs and hands off
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ needs.plan.outputs.prompt }}
          # Runs started by Claude's own pushes or by this workflow's dispatches.
          allowed_bots: 'claude[bot],github-actions[bot]'
          bot_id: ${{ env.CLAUDE_BOT_ID }}
          bot_name: 'claude[bot]'
          additional_permissions: |
            actions: read
          # --setting-sources user: the repo's CLAUDE.md is for local sessions, and a PR's .claude/
          # must never configure this run. The tool list comes from main's claude-pr-state.mjs.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --setting-sources user
            --strict-mcp-config
            --allowedTools "${{ needs.plan.outputs.tools }}"
            --disallowedTools "Bash(git add -A:*),Bash(git add --all:*),Bash(git add .:*),Bash(git commit -a:*),Bash(git commit -am:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","fixed","needs_human"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      - name: Final head
        id: final
        if: always()
        run: echo "local=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  record:
    # Runs no PR code and trusts the claude job's outputs only as far as claude-pr-state.mjs
    # --record explains: an approval needs a review run (no PR code) on an unchanged head.
    needs: [plan, claude]
    if: always() && contains(fromJSON('["review","fix-ci","update"]'), needs.plan.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write # create the handoff label if it is missing
      statuses: write
      actions: write # re-plan after an approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # the carry-over check compares the PR's commits with main
          sparse-checkout: tools/ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Record the outcome
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ needs.plan.outputs.action }}
          PLANNED: ${{ needs.plan.outputs.head }}
          REVIEW: ${{ needs.plan.outputs.review }}
          LOCAL: ${{ needs.claude.outputs.local }}
          VERDICT: ${{ needs.claude.outputs.verdict }}
          SUMMARY: ${{ needs.claude.outputs.summary }}
          CLAUDE_OUTCOME: ${{ needs.claude.outputs.outcome || needs.claude.result }}
        run: node tools/ci/claude-pr-state.mjs "$PR" --record

  handoff:
    needs: plan
    if: needs.plan.outputs.action == 'needs-human'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write # create the handoff label if it is missing
    steps:
      - name: Explain and label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ needs.plan.outputs.reason }}
        # The comment goes first, so the reason is on the PR even if labelling fails.
        run: |
          gh pr comment "$PR" --body "Claude handed this PR to a human: $REASON."
          gh label create claude-needs-human --force --color D93F0B \
            --description 'Claude PR pipeline handed this PR to a human'
          gh pr edit "$PR" --add-label claude-needs-human

  merge:
    needs: plan
    if: needs.plan.outputs.action == 'merge'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One merge at a time across all PRs; the script re-checks the PR inside this lock.
    concurrency:
      group: claude-pr-merge
      cancel-in-progress: false
    permissions:
      contents: write # the merge, and the progress commit on main
      pull-requests: write
      checks: read
      statuses: read
      actions: write # dispatch main's checks and re-plan the other PRs
    steps:
      # main only: the progress commit is generated here by main's tools/plan/progress.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Merge if still ready, then record the lanes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_AUTOMERGE: ${{ vars.CLAUDE_AUTOMERGE }}
        run: node tools/ci/claude-pr-state.mjs "$PR" --merge
