# Claude PR pipeline: reviews, fixes and merges lane PRs that carry the `claude-automerge` label,
# so PRs from an unattended local Claude Code session can land overnight. Every trigger re-reads
# the PR's current state, and tools/ci/claude-pr-state.mjs picks the one next step: review, fix CI,
# update from main, merge, or hand off to a human. Claude edits and pushes; only that script
# decides a merge. Pause everything with the repository variable CLAUDE_AUTOMERGE=off.
name: claude-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
  schedule:
    - cron: '*/30 * * * *' # safety net for events lost to concurrency or GitHub hiccups

permissions:
  contents: read

# One run per PR at a time, queued rather than cancelled: a queued run re-plans from the PR's
# state when it starts, so dropping an older queued run loses nothing.
concurrency:
  group: claude-pr-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || github.run_id }}
  cancel-in-progress: false

env:
  PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}

jobs:
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-plan every opted-in PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh pr list --label claude-automerge --json number --jq '.[].number'); do
            gh workflow run claude-pr.yml -f pr="$n"
          done

  plan:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'claude-automerge') ||
       github.event.label.name == 'claude-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      reason: ${{ steps.plan.outputs.reason }}
      head: ${{ steps.plan.outputs.head }}
      head_ref: ${{ steps.plan.outputs.head_ref }}
      review: ${{ steps.plan.outputs.review }}
      prompt: ${{ steps.plan.outputs.prompt }}
    steps:
      # The state script and prompts come from main, never from the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pick the next step
        id: plan
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_AUTOMERGE: ${{ vars.CLAUDE_AUTOMERGE }}
        run: node tools/ci/claude-pr-state.mjs "$PR"

  claude:
    needs: plan
    if: contains(fromJSON('["review","fix-ci","update"]'), needs.plan.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # Claude pushes with its GitHub App token, not this one
      pull-requests: write
      statuses: write
      actions: read # CI logs, for fix-ci
      id-token: write # OIDC exchange for the Claude GitHub App token
    env:
      ACTION: ${{ needs.plan.outputs.action }}
      PLANNED: ${{ needs.plan.outputs.head }}
    steps:
      # Check out the planned SHA, then name the branch: if the PR moved since planning, Claude's
      # push is not a fast-forward and fails, and the next run re-plans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Branch at the planned head
        env:
          HEAD_REF: ${{ needs.plan.outputs.head_ref }}
        run: git checkout -B "$HEAD_REF"

      - name: Merge main
        id: premerge
        if: env.ACTION == 'update'
        run: |
          git config user.name 'claude[bot]'
          git config user.email '41898282+claude[bot]@users.noreply.github.com'
          git fetch -q origin main
          if git merge --no-edit origin/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "merged=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.premerge.outputs.clean != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.premerge.outputs.clean != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        if: steps.premerge.outputs.clean != 'true'
        run: pnpm install --frozen-lockfile

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ needs.plan.outputs.prompt }}
          # Runs started by Claude's own pushes or by this workflow's dispatches.
          allowed_bots: 'claude[bot],github-actions[bot]'
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm install --frozen-lockfile),Bash(pnpm install --lockfile-only),Bash(git checkout origin/main -- pnpm-lock.yaml),Bash(git checkout --ours:*),Bash(git checkout --theirs:*),Bash(python3 tools/plan/progress.py),Bash(bash tools/ci/gates.sh),Bash(pnpm typecheck),Bash(pnpm test),Bash(pnpm test:*),Bash(pnpm web:build),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git merge --abort),Bash(git push origin HEAD),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh run view:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"enum":["approve","fixed","needs_human"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      # Git decides the outcome, not Claude's claim: a status goes only on the SHA this job ended
      # at, and only if the PR head is still there. A commit Claude pushed is never approved by the
      # run that wrote it; the next run reviews it, except a clean merge of main, which keeps the
      # approval the reviewed head already had.
      - name: Record the outcome
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ needs.plan.outputs.review }}
          CLEAN: ${{ steps.premerge.outputs.clean }}
          MERGED: ${{ steps.premerge.outputs.merged }}
          VERDICT: ${{ fromJSON(steps.claude.outputs.structured_output || '{}').verdict }}
          SUMMARY: ${{ fromJSON(steps.claude.outputs.structured_output || '{}').summary }}
        run: |
          local="$(git rev-parse HEAD)"
          remote="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
          status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$remote" \
              -f state="$1" -f context=claude-review -f description="$2" > /dev/null
          }
          if [ "$remote" != "$local" ]; then
            echo "PR head is $remote, not this job's $local; the next run re-plans."
          elif [ "$local" != "$PLANNED" ]; then
            if [ "$ACTION" = update ] && [ "$CLEAN" = true ] && [ "$local" = "$MERGED" ] && [ "$REVIEW" = SUCCESS ]; then
              status success "Carried over from ${PLANNED:0:7}: clean merge of main"
            fi
          elif [ "$ACTION" = review ] && [ "$VERDICT" = approve ]; then
            status success "Claude approved this SHA"
          else
            status failure "Claude handed this PR to a human"
            gh pr edit "$PR" --add-label claude-needs-human
            gh pr comment "$PR" --body "Claude handed this PR to a human (step: $ACTION). ${SUMMARY:-The Claude step failed; see the workflow run.}"
          fi

  handoff:
    needs: plan
    if: needs.plan.outputs.action == 'needs-human'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Label and explain
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          gh pr edit "$PR" --add-label claude-needs-human
          gh pr comment "$PR" --body "Claude handed this PR to a human: $REASON."

  merge:
    needs: plan
    if: needs.plan.outputs.action == 'merge'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One merge at a time across all PRs; the script re-checks the PR inside this lock.
    concurrency:
      group: claude-pr-merge
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write # dispatch main's checks and re-plan the other PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Merge if still ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_AUTOMERGE: ${{ vars.CLAUDE_AUTOMERGE }}
        run: node tools/ci/claude-pr-state.mjs "$PR" --merge
